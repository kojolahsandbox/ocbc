<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCBC Mobile - Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OCBC">
    <link rel="apple-touch-icon" href="/ocbc/icon-192.jpg">

    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/ocbc/ocbc.jpg" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/ocbc/1334.jpg" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/ocbc/2436.jpg" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/ocbc/2688.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/ocbc/1792.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">    

    <link rel="manifest" href="/ocbc/manifest.json">
    <meta name="theme-color" content="#ED1C24">    
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ocbc-red': '#ED1C24',
                        'ocbc-gray-bg': '#F4F5F7',
                        'ocbc-text': '#333333',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: #FAFAFA;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 414px) {
            .mobile-container {
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
            body { background-color: #FAFAFA; }
        }

        .input-wrapper {
            background-color: #F8F9FA;
            border: 1px solid #E5E7EB;
            transition: all 0.2s ease;
        }
        
        .input-wrapper:focus-within {
            border-color: #D1D5DB;
            background-color: #FFFFFF;
        }
    </style>
</head>
<body class="text-ocbc-text">

    <div class="mobile-container relative">
        
        <div class="flex items-center px-4 py-4 relative mt-2">
            <!-- Back Button -->
            <button onclick="window.history.back()" class="text-ocbc-red text-lg p-2 -ml-2 rounded-full hover:bg-gray-100 transition-colors">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <!-- Title -->
            <h1 class="absolute left-1/2 transform -translate-x-1/2 font-semibold text-gray-800 text-[15px]">Input Password</h1>
        </div>

        <div class="px-5 mt-8 flex-grow">
            <!-- Subtitle Description -->
            <p class="text-center text-gray-600 text-[13px] leading-relaxed mb-8 px-4">
                Input your Password to<br>log into OCBC mobile
            </p>

            <!-- Password Input Field -->
            <div class="input-wrapper rounded-xl p-3 pb-2 relative">
                <label for="password-input" class="block text-[10px] text-gray-800 font-bold mb-0.5">Login Password</label>
                <div class="flex items-center justify-between">
                    <input type="password" id="password-input" class="w-full bg-transparent text-[15px] outline-none placeholder-gray-400 py-1" placeholder="Input your login password">
                    
                    <!-- Toggle Visibility Icon -->
                    <button id="toggle-password" class="text-gray-500 p-1 rounded-full hover:bg-gray-200 focus:outline-none transition-colors">
                        <i class="fa-regular fa-eye-slash" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message Box (Hidden by default) -->
            <div id="error-message" class="hidden mt-2 text-center text-ocbc-red text-xs font-medium animate-pulse">
                Password salah. Silakan coba lagi.
            </div>

            <!-- Forgot Password Link -->
            <div class="text-center mt-6">
                <a href="#" class="text-ocbc-red text-[13px] font-semibold hover:underline">Forgot or Don't Have Password yet?</a>
            </div>
        </div>

        <div class="w-full px-5 pb-8 pt-4 bg-transparent mt-auto">
            <button id="continue-btn" class="w-full bg-ocbc-red text-white font-medium py-3.5 rounded-lg shadow-sm hover:bg-red-600 active:scale-[0.98] transition-all duration-150 text-[15px]">
                Continue
            </button>
            <!-- iOS Home Indicator Line (Simulated) -->
            <div class="w-1/3 h-1 bg-gray-300 rounded-full mx-auto mt-6"></div>
        </div>

    </div>

    <script>
        const passwordInput = document.getElementById('password-input');
        const toggleBtn = document.getElementById('toggle-password');
        const toggleIcon = document.getElementById('toggle-icon');
        const continueBtn = document.getElementById('continue-btn');
        const errorMessage = document.getElementById('error-message');

        // Toggle Password Visibility
        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle Icon class
            if (type === 'text') {
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        });

        // Hide error message when user starts typing again
        passwordInput.addEventListener('input', function() {
            errorMessage.classList.add('hidden');
        });

        // Function to handle login validation
        function handleLogin() {
            const enteredPassword = passwordInput.value;
            
            // Show loading state on button
            const originalText = continueBtn.innerHTML;
            continueBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            continueBtn.disabled = true;

            // Simulate slight network delay
            setTimeout(() => {
                if (enteredPassword === 'Bismillah2026') {
                    // Success: Redirect to Dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Failed: Show error message
                    errorMessage.classList.remove('hidden');
                    
                    // Reset button
                    continueBtn.innerHTML = originalText;
                    continueBtn.disabled = false;
                    
                    // Shake animation on the input wrapper for visual feedback
                    const wrapper = document.querySelector('.input-wrapper');
                    wrapper.style.transform = 'translateX(-5px)';
                    setTimeout(() => wrapper.style.transform = 'translateX(5px)', 50);
                    setTimeout(() => wrapper.style.transform = 'translateX(-5px)', 100);
                    setTimeout(() => wrapper.style.transform = 'translateX(5px)', 150);
                    setTimeout(() => wrapper.style.transform = 'translateX(0)', 200);
                }
            }, 400); // 400ms fake delay
        }

        // Handle Click on Continue Button
        continueBtn.addEventListener('click', handleLogin);

        // Allow pressing 'Enter' on the keyboard to submit
        passwordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleLogin();
            }
        });
    </script>
</body>
</html>
