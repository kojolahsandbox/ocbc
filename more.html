<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OCBC - More Menu</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="OCBC">
    <link rel="apple-touch-icon" href="/ocbc/icon-192.jpg">

    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/ocbc/ocbc.jpg" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/ocbc/1334.jpg" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
    <link rel="apple-touch-startup-image" href="/ocbc/2436.jpg" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/ocbc/2688.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">
    <link rel="apple-touch-startup-image" href="/ocbc/1792.jpg" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'ocbc-red': '#ED1C24',
                        'ocbc-gray-bg': '#F8F9FA',
                        'ocbc-text': '#333333',
                        'ocbc-muted': '#6B7280',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 2px 8px -2px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            background-color: #e5e7eb;
            overscroll-behavior-y: none;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: #FFFFFF;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 414px) {
            .mobile-container {
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
            body { background-color: #FFFFFF; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Scan Button Styling */
        .scan-btn-wrapper {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .scan-btn-circle {
            width: 56px;
            height: 56px;
            background-color: #ED1C24;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.05);
            color: white;
            font-size: 24px;
            z-index: 50;
        }

        .scan-btn-bg-cutout {
            position: absolute;
            top: -10px;
            width: 70px;
            height: 35px;
            background-color: transparent;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            box-shadow: 0 10px 0 0 #ffffff;
            z-index: -1;
        }
        
        /* Custom Icon Badges styles to mimic the illustration */
        .icon-badge {
            position: absolute;
            bottom: -2px;
            right: -6px;
            background: white;
            border-radius: 50%;
            padding: 2px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="text-ocbc-text">

    <div class="mobile-container relative">
        
        <!-- Red Header Profile Section -->
        <div class="bg-ocbc-red w-full px-5 py-6 pt-10 flex-shrink-0 flex justify-between items-start">
            <div>
                <h1 class="text-white font-bold text-base tracking-wide mb-1">Hello, AQIL RAHMAN!</h1>
                <p class="text-white/90 text-xs font-medium">User ID: AQILRAHM2310</p>
            </div>
            <!-- Logout Button mapped to login screen -->
            <a href="index.html" class="text-white text-xs font-medium hover:text-gray-200 transition-colors">
                Log Out
            </a>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-grow overflow-y-auto no-scrollbar pb-28">
            
            <!-- SECTION 1: Apply (Icon Grid) -->
            <div class="pt-5 pb-6">
                <h2 class="px-5 font-bold text-lg text-gray-800 mb-6">Apply</h2>
                
                <div class="grid grid-cols-3 gap-y-8">
                    <!-- Savings -->
                    <a href="/ocbc/financial.html">
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-gray-400 text-2xl">
                            <i class="fa-solid fa-vault"></i>
                            <div class="icon-badge text-yellow-500 shadow-sm"><i class="fa-solid fa-circle-dollar-to-slot text-[10px]"></i></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Savings</span>
                    </div>
                    </a>
                    <!-- Investment -->
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-teal-500 text-2xl">
                            <i class="fa-solid fa-seedling"></i>
                            <div class="icon-badge text-yellow-500 shadow-sm"><i class="fa-solid fa-circle-dollar-to-slot text-[10px]"></i></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Investment</span>
                    </div>

                    <!-- Credit Card -->
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-gray-400 text-2xl">
                            <i class="fa-solid fa-credit-card"></i>
                            <div class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Credit Card</span>
                    </div>

                    <!-- Gift Program -->
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-ocbc-red text-2xl">
                            <i class="fa-solid fa-gift"></i>
                            <div class="icon-badge text-yellow-500 shadow-sm"><i class="fa-solid fa-circle-dollar-to-slot text-[10px]"></i></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Gift Program</span>
                    </div>

                    <!-- Loans -->
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-gray-400 text-2xl">
                            <i class="fa-solid fa-file-invoice"></i>
                            <div class="icon-badge text-yellow-500 shadow-sm"><i class="fa-solid fa-circle-dollar-to-slot text-[10px]"></i></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Loans</span>
                    </div>

                    <!-- Upgrade Service -->
                    <div class="flex flex-col items-center gap-2.5 cursor-pointer">
                        <div class="relative text-gray-400 text-2xl">
                            <i class="fa-solid fa-id-badge"></i>
                            <div class="icon-badge text-ocbc-red shadow-sm"><i class="fa-solid fa-medal text-[10px]"></i></div>
                        </div>
                        <span class="text-[11px] font-medium text-gray-700">Upgrade Service</span>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Settings (List Menu) -->
            <div class="pt-4">
                <h2 class="px-5 font-bold text-lg text-gray-800 mb-2">Settings</h2>
                
                <div class="flex flex-col border-t border-gray-100">
                    
                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Customer Support</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Transfer, Top Up, & Bills</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Investment</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Card</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Financial Report</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                    <div class="px-5 py-4 border-b border-gray-200 flex justify-between items-center cursor-pointer active:bg-gray-50 transition-colors">
                        <span class="text-sm font-normal text-gray-700">Account & Others</span>
                        <i class="fa-solid fa-chevron-down text-gray-800 text-[13px]"></i>
                    </div>

                </div>
            </div>

        </div>

        <!-- Bottom Navigation (Fixed) -->
        <div class="absolute bottom-0 left-0 w-full h-16 bg-white border-t border-gray-200 z-40 flex justify-between items-center px-6 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
            
            <!-- Home (Linked to dashboard) -->
            <a href="/ocbc/dashboard.html" class="flex flex-col items-center gap-1 cursor-pointer w-12 text-gray-400 hover:text-gray-600 transition-colors decoration-transparent">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-medium">Home</span>
            </a>

            <!-- Financial (Linked to financial page) -->
            <a href="/ocbc/financial.html" class="flex flex-col items-center gap-1 cursor-pointer w-12 mr-6 text-gray-400 hover:text-gray-600 transition-colors decoration-transparent">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-medium">Financial</span>
            </a>

            <!-- Central Scan Button (Floating) -->
            <div class="scan-btn-wrapper cursor-pointer active:scale-95 transition-transform">
                <div class="scan-btn-circle relative overflow-hidden">
                     <span class="font-bold text-sm italic tracking-tighter relative z-10">QRIS</span>
                </div>
                <div class="scan-btn-bg-cutout"></div>
                <span class="text-[10px] font-medium text-gray-500 absolute bottom-[-18px]">Scan</span>
            </div>

            <!-- Rewards -->
            <div class="flex flex-col items-center gap-1 cursor-pointer w-12 ml-6 text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-gift text-lg"></i>
                <span class="text-[10px] font-medium">Rewards</span>
            </div>

            <!-- More (Active State) -->
            <a href="/ocbc/more.html" class="flex flex-col items-center gap-1 cursor-pointer w-12 text-ocbc-red">
                <i class="fa-solid fa-border-all text-lg"></i>
                <span class="text-[10px] font-bold">More</span>
            </a>
            
            <!-- iOS Home Indicator Line -->
            <div class="w-1/3 h-1 bg-gray-300 rounded-full absolute bottom-1 left-1/2 transform -translate-x-1/2"></div>
        </div>

    </div>

</body>
</html>
